packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.9.0
  "@earendil-works/chord": 1.3.0
  "@earendil-works/pi-ai": 1.3.0
  "@earendil-works/pi-durable": 1.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@modelcontextprotocol/sdk": ^1.32.1
  "@shadcn/react": ^0.3.1
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  croner: ^10.0.1
  lucide-react: ^1.57.0
  shadcn: ^4.21.5
  shiki: ^4.5.0
  streamdown: ^2.7.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
  # Transitive deps of pi-ai; their install scripts aren't needed.
  "@google/genai": false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.45"
  - "@tanstack/react-start-client@1.168.43"
  - "@tanstack/react-start-rsc@0.1.64"
  - "@tanstack/react-start-server@1.167.51"
  - "@tanstack/react-start@1.169.3"
  - "@tanstack/router-core@1.171.38"
  - "@tanstack/router-generator@1.167.45"
  - "@tanstack/router-plugin@1.168.47"
  - "@tanstack/start-client-core@1.170.38"
  - "@tanstack/start-plugin-core@1.171.54"
  - "@tanstack/start-server-core@1.169.44"
  - "@tanstack/start-storage-context@1.167.40"
